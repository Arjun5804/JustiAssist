version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: justiassist_postgres
    environment:
      POSTGRES_USER: justiassist
      POSTGRES_PASSWORD: password
      POSTGRES_DB: justiassist_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justiassist -d justiassist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: justiassist_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: justiassist_migrations
    environment:
      - DATABASE_URL=postgresql://justiassist:password@postgres:5432/justiassist_db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: justiassist_backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://justiassist:password@postgres:5432/justiassist_db
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_ROOT=/.data/storage
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_secret_for_local_dev_only}
    volumes:
      - ./vector_stores:/app/vector_stores
      - ./data:/app/data
      - ./project datasets:/app/project datasets
      - ./.data/storage:/app/.data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      # We don't depend on redis for correctness
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: justiassist_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
