name: JustiAssist CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      JWT_SECRET_KEY: testing-secret-key-do-not-use-in-production
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Run Pytest
        run: python -m pytest

  migration:
    name: Migration Validation
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic check
        run: alembic check

  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint
